# Serves the dashboard and forwards /api/* to the FastAPI container. This does the same
# job as the Vite dev proxy, so the browser talks to one origin and no CORS is needed.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # "/api/tickets" -> "http://backend:8000/tickets" ("backend" is the compose service name)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 5m;  # CSV uploads
    }

    # Built JS/CSS have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes like /tickets/12 have no file on disk: serve the app and let React route.
    location / {
        try_files $uri /index.html;
    }
}
